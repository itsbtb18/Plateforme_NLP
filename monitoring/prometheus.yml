global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: django_scraping_metrics
    scheme: http
    metrics_path: /scraping/metrics/
    authorization:
      type: Bearer
      credentials: replace-with-metrics-token
    static_configs:
      - targets:
          - django:8000

  - job_name: redis_exporter
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - redis-exporter:9121
