groups:
  - name: scraping-slo-alerts
    interval: 30s
    rules:
      - alert: ScrapingSuccessRateLow
        expr: |
          (
            sum by (category) (increase(scrape_runs_total{status="success"}[1h]))
            /
            clamp_min(sum by (category) (increase(scrape_runs_total[1h])), 1)
          ) < 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Scraping success rate dropped for category {{ $labels.category }}"
          description: "Success ratio is below 80% for 10 minutes."

      - alert: ScrapingQueueLagHigh
        expr: scrape_queue_lag_seconds > 1800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Scraping queue lag is high"
          description: "Queue lag is above 30 minutes for category {{ $labels.category }}."

      - alert: SourceHealthCritical
        expr: source_health_score < 25
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Source health is critical"
          description: "Source {{ $labels.source_url }} health score is below 25."

      - alert: FileDownloadFailuresHigh
        expr: |
          (
            sum(rate(file_download_total{outcome="failure"}[10m]))
            /
            clamp_min(sum(rate(file_download_total[10m])), 0.001)
          ) > 0.30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "File download failure rate is high"
          description: "Failure rate above 30% over last 10 minutes."
