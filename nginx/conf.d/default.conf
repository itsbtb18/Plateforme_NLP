# Main server block
server {
    listen 80;
    server_name localhost;

    # Resolve Docker service names dynamically to avoid stale upstream IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Client body size
    client_max_body_size 100M;
    
    # Timeouts
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # ============================================
    # FASTAPI CHATBOT - /api/ prefix
    # ============================================
    location /api/ {
        set $fastapi_upstream fastapi:8000;
        proxy_pass http://$fastapi_upstream/;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ============================================
    # FASTAPI CHATBOT - /ai/ direct compatibility
    # ============================================
    location /ai/ {
        set $fastapi_upstream fastapi:8000;
        proxy_pass http://$fastapi_upstream/ai/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through CORS headers and support preflight requests
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ============================================
    # DJANGO TS PROXY COMPATIBILITY
    # Handles buggy frontend requests like /ts-ai/en/api/ts/summarize/
    # by stripping /ts-ai and forwarding to Django's localized proxy routes.
    # ============================================
    location ^~ /ts-ai/api/ts/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRFToken" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        rewrite ^/ts-ai/(.*)$ /$1 break;
        proxy_pass http://django:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRFToken" always;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ ^/ts-ai/[a-z][a-z]/api/ts/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRFToken" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        rewrite ^/ts-ai/(.*)$ /$1 break;
        proxy_pass http://django:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRFToken" always;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ============================================
    # STANDALONE TRANSLATION/SUMMARIZATION - /ts-ai/
    # ============================================
    location /ts-ai/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-TS-API-Key" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        set $ts_upstream translation_summarization:8010;
        proxy_pass http://$ts_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-TS-API-Key" always;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ============================================
    # DJANGO STATIC FILES
    # ============================================
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Gzip static files
        gzip_static on;
    }

    # ============================================
    # DJANGO MEDIA FILES
    # ============================================
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Serve favicon without proxying to Django
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        root /static;
        try_files /images/favicon.ico =204;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # DJANGO WEBSOCKETS - /ws/ prefix
    # ============================================
    location /ws/ {
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        
        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-lived connections
        proxy_read_timeout 86400;  # Keep WS alive for 24h max
        proxy_send_timeout 86400s;
    }

    # ============================================
    # CHATBOT STREAMING - disable buffering for live SSE
    # ============================================
    location /chatbot/ask_stream/ {
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ============================================
    # DJANGO APPLICATION - Root
    # ============================================
    location / {
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ============================================
    # HEALTH CHECK
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # ERROR PAGES
    # ============================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
