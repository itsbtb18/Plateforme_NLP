groups:
  - name: scraping-alerts
    rules:
      - alert: ScrapingCategoryNoSuccessfulRun24h
        expr: scrape_queue_lag_seconds > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No successful scrape in 24h for category {{ $labels.category }}"
          description: "Queue lag exceeded 24 hours for category {{ $labels.category }}."

      - alert: ScrapingCircuitOpenTooLong
        expr: source_health_state{state="open"} == 1
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker open too long for source {{ $labels.source_url }}"
          description: "Source {{ $labels.source_url }} has remained in open state for more than one hour."

      - alert: HighEnrichmentFailureRate
        expr: |
          (
            sum(rate(enrichment_failures_total[1h]))
            /
            clamp_min(sum(rate(enrichment_duration_seconds_count[1h])), 1)
          ) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Enrichment failure rate above 20%"
          description: "The enrichment failure ratio is above 20% over the last hour."
