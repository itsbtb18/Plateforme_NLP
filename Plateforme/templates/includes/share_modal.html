{# templates/includes/share_modal.html  – global modal, included once in base.html #}
{% load i18n %}
{% if user.is_authenticated %}
<!-- ==================== GLOBAL SHARE MODAL ==================== -->
<div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:480px;">
    <div class="modal-content rounded-4 shadow-lg border-0">

      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="shareModalLabel">
          <i class="fas fa-share-alt me-2 text-primary"></i>{% trans "Share this item" %}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body pt-2 pb-4 px-4">

        <!-- Item preview -->
        <div class="p-2 rounded-3 mb-3" style="background:#f8fafc;border:1px solid #e2e8f0;">
          <small class="text-uppercase text-muted fw-semibold" id="shareModalType" style="font-size:.7rem;"></small>
          <p class="mb-0 fw-semibold text-dark text-truncate" id="shareModalTitle"></p>
        </div>

        <!-- User search -->
        <label class="form-label fw-semibold small">{% trans "Share with" %}</label>
        <div class="position-relative mb-3">
          <input type="text" id="shareUserSearch"
                 class="form-control rounded-3"
                 placeholder="{% trans 'Search by name…' %}"
                 autocomplete="off">
          <div id="shareUserResults"
               class="position-absolute w-100 bg-white border rounded-3 shadow-sm mt-1 d-none"
               style="z-index:2000;max-height:200px;overflow-y:auto;"></div>
          <!-- Hidden selected user -->
          <input type="hidden" id="shareReceiverId">
          <div id="shareSelectedUser" class="d-none mt-2 d-flex align-items-center gap-2 p-2 bg-primary-subtle rounded-3">
            <i class="fas fa-user-circle text-primary"></i>
            <span id="shareSelectedName" class="small fw-semibold text-primary"></span>
            <button type="button" class="btn-close btn-close ms-auto" id="shareClearUser" style="font-size:.6rem;"></button>
          </div>
        </div>

        <!-- Message -->
        <label class="form-label fw-semibold small">{% trans "Message" %} <span class="fw-normal text-muted">({% trans "optional" %})</span></label>
        <textarea id="shareMessage" rows="3" class="form-control rounded-3"
                  placeholder="{% trans 'Add a note…' %}"></textarea>

        <!-- Error/success feedback -->
        <div id="shareFeedback" class="mt-3 d-none"></div>
      </div>

      <div class="modal-footer border-0 pt-0 px-4 pb-4">
        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
        <button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold" id="shareSubmitBtn" disabled>
          <i class="fas fa-paper-plane me-1"></i> {% trans "Send" %}
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const SHARE_URL    = "{% url 'sharing:create_share' %}";
  const SEARCH_URL   = "{% url 'sharing:user_search' %}";
  const CSRF         = () => document.cookie.split(';').find(c=>c.trim().startsWith('csrftoken='))?.split('=')[1] || '';

  let _contentType = '', _objectId = '', _receiverId = '';
  let _searchTimer = null;

  // Open modal from any "share" button: data-share-type, data-share-id, data-share-title
  document.addEventListener('click', function(e){
    const btn = e.target.closest('[data-share-type]');
    if (!btn) return;
    _contentType = btn.dataset.shareType;
    _objectId    = btn.dataset.shareId;
    const title  = btn.dataset.shareTitle || '';
    document.getElementById('shareModalType').textContent = _contentType;
    document.getElementById('shareModalTitle').textContent = title;
    resetModal();
    new bootstrap.Modal(document.getElementById('shareModal')).show();
  });

  // User search autocomplete
  document.getElementById('shareUserSearch').addEventListener('input', function(){
    clearTimeout(_searchTimer);
    const q = this.value.trim();
    if (q.length < 2){ closeResults(); return; }
    _searchTimer = setTimeout(() => doSearch(q), 300);
  });

  async function doSearch(q){
    const res  = await fetch(SEARCH_URL + '?q=' + encodeURIComponent(q));
    const data = await res.json();
    renderResults(data.users || []);
  }

  function renderResults(users){
    const box = document.getElementById('shareUserResults');
    if (!users.length){ box.innerHTML = '<p class="p-3 text-muted small mb-0">{% trans "No users found." %}</p>'; box.classList.remove('d-none'); return; }
    box.innerHTML = users.map(u =>
      `<div class="p-2 px-3 d-flex align-items-center gap-2 user-opt" style="cursor:pointer;" data-id="${u.id}" data-name="${escHtml(u.name)}">
         <i class="fas fa-user-circle text-muted"></i>
         <span class="small">${escHtml(u.name)}</span>
       </div>`
    ).join('');
    box.classList.remove('d-none');
    box.querySelectorAll('.user-opt').forEach(el => el.addEventListener('click', selectUser));
  }

  function selectUser(){
    _receiverId = this.dataset.id;
    document.getElementById('shareReceiverId').value = _receiverId;
    document.getElementById('shareSelectedName').textContent = this.dataset.name;
    document.getElementById('shareSelectedUser').classList.remove('d-none');
    document.getElementById('shareSubmitBtn').disabled = false;
    document.getElementById('shareUserSearch').value = '';
    closeResults();
  }

  document.getElementById('shareClearUser').addEventListener('click', function(){
    _receiverId = '';
    document.getElementById('shareReceiverId').value = '';
    document.getElementById('shareSelectedUser').classList.add('d-none');
    document.getElementById('shareSubmitBtn').disabled = true;
  });

  document.addEventListener('click', function(e){
    if (!e.target.closest('#shareUserSearch') && !e.target.closest('#shareUserResults')) closeResults();
  });

  function closeResults(){
    document.getElementById('shareUserResults').classList.add('d-none');
  }

  // Submit
  document.getElementById('shareSubmitBtn').addEventListener('click', async function(){
    const msg = document.getElementById('shareMessage').value.trim();
    this.disabled = true;
    this.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> {% trans "Sending…" %}';

    try {
      const res = await fetch(SHARE_URL, {
        method: 'POST',
        headers: {'Content-Type':'application/json','X-CSRFToken': CSRF()},
        body: JSON.stringify({
          receiver_id: _receiverId,
          content_type: _contentType,
          object_id: _objectId,
          message: msg,
        }),
      });
      const data = await res.json();
      const fb = document.getElementById('shareFeedback');
      if (data.success){
        fb.className = 'mt-3 alert alert-success rounded-3 small';
        fb.textContent = '{% trans "Shared successfully!" %}';
        fb.classList.remove('d-none');
        setTimeout(() => bootstrap.Modal.getInstance(document.getElementById('shareModal')).hide(), 1500);
      } else {
        fb.className = 'mt-3 alert alert-danger rounded-3 small';
        fb.textContent = data.error || '{% trans "Failed to share." %}';
        fb.classList.remove('d-none');
        this.disabled = false;
        this.innerHTML = '<i class="fas fa-paper-plane me-1"></i> {% trans "Send" %}';
      }
    } catch(err){
      this.disabled = false;
      this.innerHTML = '<i class="fas fa-paper-plane me-1"></i> {% trans "Send" %}';
    }
  });

  function resetModal(){
    _receiverId = '';
    document.getElementById('shareUserSearch').value = '';
    document.getElementById('shareMessage').value = '';
    document.getElementById('shareSelectedUser').classList.add('d-none');
    document.getElementById('shareSubmitBtn').disabled = true;
    const fb = document.getElementById('shareFeedback');
    fb.classList.add('d-none');
    fb.textContent = '';
    closeResults();
  }

  function escHtml(str){
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }
})();
</script>
<!-- ==================== END SHARE MODAL ==================== -->
{% endif %}
