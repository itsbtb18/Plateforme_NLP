{# templates/includes/share_modal_modern.html – Instagram-style Share Modal #}
{% load i18n %}
{% if user.is_authenticated %}
<!-- ==================== MODERN INSTAGRAM-STYLE SHARE MODAL ==================== -->
<div class="share-modal-modern" id="shareModalModern" role="dialog" aria-labelledby="shareModalLabel" aria-hidden="true">
  <div class="share-modal-overlay"></div>
  <div class="share-modal-container">
    <div class="share-modal-content">
      
      <!-- Header -->
      <div class="share-modal-header">
        <h2 id="shareModalLabel">{% trans "Share" %}</h2>
        <button type="button" class="share-modal-close" aria-label="{% trans 'Close' %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Search Box -->
      <div class="share-modal-search">
        <svg class="share-search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input 
          type="text" 
          id="shareSearchInput" 
          class="share-search-input" 
          placeholder="{% trans 'Search friends...' %}"
          autocomplete="off"
        />
      </div>

      <!-- Item Preview (small) -->
      <div class="share-item-preview" id="shareItemPreview">
        <div class="share-item-type" id="shareItemType"></div>
        <div class="share-item-title" id="shareItemTitle"></div>
      </div>

      <!-- Friends List -->
      <div class="share-friends-list" id="shareFriendsList">
        <div class="share-loading">
          <div class="share-spinner"></div>
          <p>{% trans "Loading friends..." %}</p>
        </div>
      </div>

      <!-- Optional Message Field -->
      <div class="share-message-container" id="shareMessageContainer" style="display: none;">
        <label class="share-message-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          {% trans "Add a message" %}
        </label>
        <textarea 
          id="shareMessageText" 
          class="share-message-input" 
          rows="3"
          placeholder="{% trans 'Write something...' %}"
        ></textarea>
      </div>

      <!-- Send Button -->
      <div class="share-modal-footer">
        <div class="share-selected-count" id="shareSelectedCount">
          <span id="shareCountText">{% trans "0 selected" %}</span>
        </div>
        <button type="button" class="share-send-btn" id="shareSendBtn" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <span>{% trans "Send" %}</span>
        </button>
      </div>

    </div>
  </div>
</div>

<!-- Success Toast Notification -->
<div class="share-toast" id="shareToast">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"></polyline>
  </svg>
  <span id="shareToastMessage">{% trans "Shared successfully!" %}</span>
</div>

<style>
/* ==================== SHARE MODAL MODERN STYLES ==================== */
.share-modal-modern {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 9999;
  display: none;
  opacity: 0;
  transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.share-modal-modern.active {
  display: flex;
  align-items: center;
  justify-content: center;
}

.share-modal-modern.show {
  opacity: 1;
}

.share-modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
}

.share-modal-container {
  position: relative;
  width: 90%;
  max-width: 480px;
  max-height: 90vh;
  transform: scale(0.9) translateY(20px);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.share-modal-modern.show .share-modal-container {
  transform: scale(1) translateY(0);
}

.share-modal-content {
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  display: flex;
  flex-direction: column;
  max-height: 90vh;
  overflow: hidden;
}

/* Header */
.share-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid #e5e7eb;
}

.share-modal-header h2 {
  font-size: 18px;
  font-weight: 700;
  margin: 0;
  color: #1f2937;
}

.share-modal-close {
  background: none;
  border: none;
  padding: 8px;
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  color: #6b7280;
}

.share-modal-close:hover {
  background: #f3f4f6;
}

/* Search Box */
.share-modal-search {
  position: relative;
  padding: 12px 24px;
  border-bottom: 1px solid #e5e7eb;
}

.share-search-icon {
  position: absolute;
  left: 38px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
  pointer-events: none;
}

.share-search-input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  font-size: 14px;
  background: #f9fafb;
  transition: all 0.2s;
}

.share-search-input:focus {
  outline: none;
  border-color: #667eea;
  background: white;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

/* Item Preview */
.share-item-preview {
  padding: 12px 24px;
  background: #f9fafb;
  border-bottom: 1px solid #e5e7eb;
}

.share-item-type {
  font-size: 11px;
  text-transform: uppercase;
  color: #667eea;
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.share-item-title {
  font-size: 14px;
  font-weight: 600;
  color: #1f2937;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Friends List */
.share-friends-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  max-height: 400px;
}

.share-friends-list::-webkit-scrollbar {
  width: 6px;
}

.share-friends-list::-webkit-scrollbar-track {
  background: transparent;
}

.share-friends-list::-webkit-scrollbar-thumb {
  background: #d1d5db;
  border-radius: 10px;
}

.share-friends-list::-webkit-scrollbar-thumb:hover {
  background: #9ca3af;
}

/* Loading */
.share-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: #9ca3af;
}

.share-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #e5e7eb;
  border-top-color: #667eea;
  border-radius: 50%;
  animation: share-spin 0.8s linear infinite;
  margin-bottom: 12px;
}

@keyframes share-spin {
  to { transform: rotate(360deg); }
}

/* Friend Item */
.share-friend-item {
  display: flex;
  align-items: center;
  padding: 12px 24px;
  cursor: pointer;
  transition: background 0.2s;
  position: relative;
}

.share-friend-item:hover {
  background: #f9fafb;
}

.share-friend-item.selected {
  background: #eff6ff;
}

.share-friend-checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid #d1d5db;
  border-radius: 50%;
  margin-right: 12px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.share-friend-item.selected .share-friend-checkbox {
  background: #667eea;
  border-color: #667eea;
}

.share-friend-checkbox svg {
  width: 14px;
  height: 14px;
  color: white;
  opacity: 0;
  transition: opacity 0.2s;
}

.share-friend-item.selected .share-friend-checkbox svg {
  opacity: 1;
}

.share-friend-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  margin-right: 12px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 600;
  font-size: 16px;
}

.share-friend-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.share-friend-online {
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 12px;
  height: 12px;
  background: #10b981;
  border: 2px solid white;
  border-radius: 50%;
}

.share-friend-info {
  flex: 1;
  min-width: 0;
}

.share-friend-name {
  font-size: 15px;
  font-weight: 600;
  color: #1f2937;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.share-friend-status {
  font-size: 13px;
  color: #6b7280;
}

/* Message Container */
.share-message-container {
  padding: 16px 24px;
  border-top: 1px solid #e5e7eb;
}

.share-message-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 8px;
}

.share-message-label svg {
  color: #667eea;
}

.share-message-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  transition: all 0.2s;
}

.share-message-input:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

/* Footer */
.share-modal-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-top: 1px solid #e5e7eb;
  background: #f9fafb;
}

.share-selected-count {
  font-size: 14px;
  font-weight: 600;
  color: #6b7280;
}

.share-send-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 25px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}

.share-send-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.share-send-btn:active:not(:disabled) {
  transform: translateY(0);
}

.share-send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.share-send-btn.loading {
  pointer-events: none;
}

.share-send-btn.loading svg {
  animation: share-spin 0.8s linear infinite;
}

/* Toast Notification */
.share-toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1f2937;
  color: white;
  padding: 14px 24px;
  border-radius: 50px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  z-index: 10000;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.share-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.share-toast svg {
  color: #10b981;
  flex-shrink: 0;
}

/* RTL Support */
[dir="rtl"] .share-search-icon {
  left: auto;
  right: 38px;
}

[dir="rtl"] .share-search-input {
  padding: 12px 42px 12px 16px;
}

[dir="rtl"] .share-friend-checkbox {
  margin-right: 0;
  margin-left: 12px;
}

[dir="rtl"] .share-friend-avatar {
  margin-right: 0;
  margin-left: 12px;
}

[dir="rtl"] .share-friend-online {
  right: auto;
  left: 2px;
}

/* Mobile Responsive */
@media (max-width: 640px) {
  .share-modal-container {
    width: 100%;
    max-width: 100%;
    height: 100%;
    max-height: 100%;
  }

  .share-modal-content {
    border-radius: 0;
    max-height: 100vh;
    height: 100%;
  }

  .share-modal-header {
    padding: 16px 20px;
  }

  .share-modal-search {
    padding: 10px 20px;
  }

  .share-item-preview {
    padding: 10px 20px;
  }

  .share-friend-item {
    padding: 10px 20px;
  }

  .share-message-container {
    padding: 12px 20px;
  }

  .share-modal-footer {
    padding: 12px 20px;
  }

  .share-friends-list {
    max-height: none;
  }
}

/* Empty State */
.share-empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
  color: #9ca3af;
}

.share-empty-state svg {
  width: 64px;
  height: 64px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.share-empty-state p {
  font-size: 15px;
  margin: 0;
}
</style>

<script>
(function() {
  'use strict';

  const SHARE_URL = "{% url 'sharing:create_share' %}";
  const SEARCH_URL = "{% url 'sharing:user_search' %}";
  const CSRF = () => document.cookie.split(';').find(c => c.trim().startsWith('csrftoken='))?.split('=')[1] || '';

  // Translation map for content types
  const CONTENT_TYPE_TRANSLATIONS = {
    'tool': '{% trans "TOOL" %}',
    'corpus': '{% trans "CORPUS" %}',
    'course': '{% trans "COURSE" %}',
    'project': '{% trans "PROJECT" %}',
    'event': '{% trans "EVENT" %}',
    'topic': '{% trans "TOPIC" %}',
    'institution': '{% trans "INSTITUTION" %}',
    'article': '{% trans "ARTICLE" %}',
    'thesis': '{% trans "THESIS" %}',
    'memoir': '{% trans "MEMOIR" %}',
    'chatbot': '{% trans "AI RESPONSE" %}'
  };

  let contentType = '';
  let objectId = '';
  let selectedFriends = new Set();
  let allFriends = [];
  let searchTimer = null;

  const modal = document.getElementById('shareModalModern');
  const overlay = modal.querySelector('.share-modal-overlay');
  const closeBtn = modal.querySelector('.share-modal-close');
  const searchInput = document.getElementById('shareSearchInput');
  const friendsList = document.getElementById('shareFriendsList');
  const sendBtn = document.getElementById('shareSendBtn');
  const countText = document.getElementById('shareCountText');
  const messageContainer = document.getElementById('shareMessageContainer');
  const messageInput = document.getElementById('shareMessageText');
  const toast = document.getElementById('shareToast');
  const toastMessage = document.getElementById('shareToastMessage');

  // Open modal when share button clicked
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('[data-share-type]');
    if (!btn) return;

    e.preventDefault();
    e.stopPropagation();

    contentType = btn.dataset.shareType;
    objectId = btn.dataset.shareId;
    const title = btn.dataset.shareTitle || '';

    // Use translated content type
    const translatedType = CONTENT_TYPE_TRANSLATIONS[contentType] || contentType.toUpperCase();
    document.getElementById('shareItemType').textContent = translatedType;
    document.getElementById('shareItemTitle').textContent = title;

    openModal();
  });

  // Listen for custom event from chatbot share menu
  document.addEventListener('openShareModal', function(e) {
    const detail = e.detail || {};
    
    contentType = detail.type || '';
    objectId = detail.id || '';
    const title = detail.title || '';
    
    const translatedType = CONTENT_TYPE_TRANSLATIONS[contentType] || contentType.toUpperCase();
    document.getElementById('shareItemType').textContent = translatedType;
    document.getElementById('shareItemTitle').textContent = title;
    
    openModal();
  });

  function openModal() {
    resetModal();
    modal.classList.add('active');
    setTimeout(() => modal.classList.add('show'), 10);
    loadFriends();
  }

  function closeModal() {
    modal.classList.remove('show');
    setTimeout(() => {
      modal.classList.remove('active');
      resetModal();
    }, 300);
  }

  function resetModal() {
    selectedFriends.clear();
    allFriends = [];
    searchInput.value = '';
    messageInput.value = '';
    messageContainer.style.display = 'none';
    updateSendButton();
    friendsList.innerHTML = `
      <div class="share-loading">
        <div class="share-spinner"></div>
        <p>{% trans "Loading friends..." %}</p>
      </div>
    `;
  }

  async function loadFriends(query = '') {
    try {
      const url = query ? `${SEARCH_URL}?q=${encodeURIComponent(query)}` : SEARCH_URL + '?q=';
      const res = await fetch(url);
      const data = await res.json();
      allFriends = data.users || [];
      renderFriends(allFriends);
    } catch (err) {
      console.error('Failed to load friends:', err);
      friendsList.innerHTML = `
        <div class="share-empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <p>{% trans "Failed to load friends" %}</p>
        </div>
      `;
    }
  }

  function renderFriends(friends) {
    if (!friends.length) {
      friendsList.innerHTML = `
        <div class="share-empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <p>{% trans "No friends found" %}</p>
        </div>
      `;
      return;
    }

    friendsList.innerHTML = friends.map(friend => {
      const isSelected = selectedFriends.has(friend.id);
      const initial = (friend.name || '?')[0].toUpperCase();
      const avatarHTML = friend.avatar 
        ? `<img src="${escapeHtml(friend.avatar)}" alt="${escapeHtml(friend.name)}">` 
        : initial;

      return `
        <div class="share-friend-item ${isSelected ? 'selected' : ''}" data-friend-id="${friend.id}" data-friend-name="${escapeHtml(friend.name)}">
          <div class="share-friend-checkbox">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="share-friend-avatar">
            ${avatarHTML}
            <div class="share-friend-online"></div>
          </div>
          <div class="share-friend-info">
            <div class="share-friend-name">${escapeHtml(friend.name)}</div>
            <div class="share-friend-status">{% trans "Active now" %}</div>
          </div>
        </div>
      `;
    }).join('');

    // Attach click handlers
    friendsList.querySelectorAll('.share-friend-item').forEach(item => {
      item.addEventListener('click', toggleFriend);
    });
  }

  function toggleFriend() {
    const friendId = this.dataset.friendId;
    
    if (selectedFriends.has(friendId)) {
      selectedFriends.delete(friendId);
      this.classList.remove('selected');
    } else {
      selectedFriends.add(friendId);
      this.classList.add('selected');
    }

    updateSendButton();
  }

  function updateSendButton() {
    const count = selectedFriends.size;
    
    if (count === 0) {
      countText.textContent = '{% trans "0 selected" %}';
      sendBtn.disabled = true;
      messageContainer.style.display = 'none';
    } else {
      const text = count === 1 
        ? '{% trans "1 selected" %}'
        : `${count} {% trans "selected" %}`;
      countText.textContent = text;
      sendBtn.disabled = false;
      messageContainer.style.display = 'block';
    }
  }

  async function sendShares() {
    if (selectedFriends.size === 0) return;

    sendBtn.disabled = true;
    sendBtn.classList.add('loading');
    const originalHTML = sendBtn.innerHTML;
    sendBtn.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
      </svg>
      <span>{% trans "Sending..." %}</span>
    `;

    const message = messageInput.value.trim();
    const receivers = Array.from(selectedFriends);
    let successCount = 0;
    let failCount = 0;

    for (const receiverId of receivers) {
      try {
        const res = await fetch(SHARE_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': CSRF()
          },
          body: JSON.stringify({
            receiver_id: receiverId,
            content_type: contentType,
            object_id: objectId,
            message: message
          })
        });

        const data = await res.json();
        if (data.success) {
          successCount++;
        } else {
          failCount++;
        }
      } catch (err) {
        failCount++;
      }
    }

    // Show result
    sendBtn.innerHTML = originalHTML;
    sendBtn.classList.remove('loading');

    if (successCount > 0) {
      const msg = successCount === 1
        ? '{% trans "Shared with 1 friend!" %}'
        : `{% trans "Shared with" %} ${successCount} {% trans "friends!" %}`;
      showToast(msg);
      closeModal();
    } else {
      showToast('{% trans "Failed to share" %}', false);
      sendBtn.disabled = false;
    }
  }

  function showToast(message, success = true) {
    toastMessage.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Event Listeners
  overlay.addEventListener('click', closeModal);
  closeBtn.addEventListener('click', closeModal);
  sendBtn.addEventListener('click', sendShares);

  searchInput.addEventListener('input', function() {
    clearTimeout(searchTimer);
    const query = this.value.trim();
    
    if (query.length < 2) {
      loadFriends();
      return;
    }

    searchTimer = setTimeout(() => {
      loadFriends(query);
    }, 300);
  });

  // Close on Escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('active')) {
      closeModal();
    }
  });

})();
</script>
<!-- ==================== END MODERN SHARE MODAL ==================== -->
{% endif %}
