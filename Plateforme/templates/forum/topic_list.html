{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block title %}{% trans "Discussion topics | Arabic NLP Platform" %}{% endblock %}

{% block extra_styles %}
<style>
/* ═══════════════════════════════════════════════════════════════
   FILTER PILLS BAR - Unified Design System
   ═══════════════════════════════════════════════════════════════ */
.filter-pills-bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.5rem;
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    border-radius: 16px;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    border: 1px solid #e2e8f0;
}

.filter-pills-label {
    font-weight: 600;
    color: #64748b;
    font-size: 0.9rem;
    white-space: nowrap;
}

.filter-pills-group {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.filter-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border-radius: 50px;
    font-size: 0.875rem;
    font-weight: 500;
    text-decoration: none;
    border: 1.5px solid #e2e8f0;
    background: white;
    color: #64748b;
    transition: all 0.2s ease;
    cursor: pointer;
}

.filter-pill:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
    color: #475569;
    transform: translateY(-1px);
}

.filter-pill.active {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: white;
    border-color: #3b82f6;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

.filter-pill.active:hover {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
}

.filter-pill i {
    font-size: 0.8rem;
}

/* Search in Pills Bar */
.filter-search-wrapper {
    display: flex;
    align-items: center;
    background: white;
    border: 1.5px solid #e2e8f0;
    border-radius: 50px;
    padding: 0.25rem;
    transition: all 0.2s ease;
    flex: 1;
    max-width: 280px;
    min-width: 200px;
}

.filter-search-wrapper:focus-within {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.filter-search-input {
    border: none;
    outline: none;
    padding: 0.375rem 0.75rem;
    font-size: 0.875rem;
    background: transparent;
    flex: 1;
    min-width: 0;
}

.filter-search-btn {
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 0.375rem 0.75rem;
    cursor: pointer;
    transition: background 0.2s ease;
}

.filter-search-btn:hover {
    background: #2563eb;
}

/* Forum Header */
.forum-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 1rem;
}

.forum-title {
    font-size: 2rem;
    font-weight: 700;
    color: #1e293b;
    margin: 0;
}

/* Topic Cards */
.topic-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.topic-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    border: 1px solid #e2e8f0;
    padding: 1.5rem;
    transition: all 0.3s ease;
}

.topic-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
}

.topic-title h3 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    color: #1e293b;
}

.topic-title:hover h3 {
    color: #3b82f6;
}

.topic-meta {
    display: flex;
    gap: 1rem;
    margin-top: 0.5rem;
    color: #64748b;
    font-size: 0.875rem;
}

.topic-description {
    color: #475569;
    margin: 1rem 0;
    line-height: 1.6;
}

.topic-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 1rem;
    border-top: 1px solid #f1f5f9;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.topic-actions {
    display: flex;
    gap: 0.5rem;
}

/* Empty State */
.empty-state {
    text-align: center;
    padding: 4rem 2rem;
    background: white;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
}

.empty-state-icon {
    font-size: 4rem;
    color: #cbd5e1;
    margin-bottom: 1rem;
}

.empty-state h3 {
    color: #1e293b;
    margin-bottom: 0.5rem;
}

.empty-state p {
    color: #64748b;
    margin-bottom: 1.5rem;
}

[dir="rtl"] .filter-pills-bar {
    flex-direction: row-reverse;
}
</style>
{% endblock %}

{% block content %}
