{% load i18n %}
{% with value=status|default:''|lower %}
<span style="display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;border:1px solid transparent;padding:.16rem .48rem;font-size:.66rem;font-weight:800;{% if value == 'translated' %}background:#ecfdf5;color:var(--trans-translated);border-color:rgba(16,185,129,.3);{% elif value == 'copied' or value == 'partial' %}background:#fffbeb;color:var(--trans-copied);border-color:rgba(245,158,11,.35);{% else %}background:#fef2f2;color:var(--trans-missing);border-color:rgba(239,68,68,.35);{% endif %}">
  {% if value == 'translated' %}✅ {% trans "Translated" %}
  {% elif value == 'copied' or value == 'partial' %}⚠️ {% trans "Copied" %}
  {% else %}❌ {% trans "Missing" %}{% endif %}
</span>
{% endwith %}
