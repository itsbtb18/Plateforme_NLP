{% load i18n %}
<article style="display:flex; gap:0.9rem; align-items:flex-start; padding:0.95rem; border:1px solid #e2e8f0; border-radius:12px; background:#fff;">
    <div style="width:52px; height:52px; border-radius:50%; overflow:hidden; background:#e2e8f0; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        {% if speaker.avatar %}
        <img src="{{ speaker.avatar.url }}" alt="{{ speaker.name }}" style="width:100%; height:100%; object-fit:cover;">
        {% else %}
        <span style="font-weight:700; color:#334155;">
            {{ speaker.name|slice:":1"|upper }}
        </span>
        {% endif %}
    </div>
    <div style="min-width:0;">
        <h4 style="margin:0 0 0.2rem; font-size:0.95rem; color:#0f172a;">{{ speaker.name }}</h4>
        {% if speaker.affiliation %}
        <p style="margin:0 0 0.3rem; font-size:0.83rem; color:#475569;">{{ speaker.affiliation }}</p>
        {% endif %}
        {% if speaker.talk_title %}
        <p style="margin:0; font-size:0.82rem; color:#1d4ed8; font-weight:600;">{{ speaker.talk_title }}</p>
        {% endif %}
    </div>
</article>
