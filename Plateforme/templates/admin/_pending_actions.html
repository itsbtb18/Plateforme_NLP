{% load i18n %}
<div class="n-acts n-acts-pending">
  <form method="post" action="{% url 'pages:admin_delete_item' model_type=model_type pk=item_pk %}" onsubmit="return confirm('{% trans "Are you sure you want to delete this item?" %}');">
    {% csrf_token %}
    <button type="submit" class="n-act n-act-red" title="{% trans 'Delete' %}">
      <i class="fas fa-trash"></i>
    </button>
  </form>
  <a href="{{ edit_url }}" class="n-act n-act-yellow" title="{% trans 'Edit' %}">
    <i class="fas fa-edit"></i>
  </a>
  <a href="{{ view_url }}" class="n-act n-act-blue" title="{% trans 'View' %}">
    <i class="fas fa-eye"></i>
  </a>
</div>
