<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" class="courses-creative-svg">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background glow circles -->
  <circle cx="100" cy="80" r="70" fill="url(#glowGrad)"/>
  <circle cx="400" cy="150" r="80" fill="url(#glowGrad)"/>
  <circle cx="250" cy="450" r="90" fill="url(#glowGrad)"/>

  <!-- Learning Path - curved line -->
  <path d="M 80 250 Q 150 150, 250 120 T 420 260" 
        fill="none" 
        stroke="url(#pathGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-dasharray="10,5"
        opacity="0.6"/>

  <!-- Book 1 - Bottom Left -->
  <g class="book-item">
    <rect x="40" y="320" width="80" height="100" rx="6" 
          fill="rgba(167, 139, 250, 0.2)" 
          stroke="rgba(167, 139, 250, 0.5)" 
          stroke-width="2"/>
    <line x1="50" y1="340" x2="110" y2="340" stroke="rgba(167, 139, 250, 0.6)" stroke-width="2"/>
    <line x1="50" y1="360" x2="110" y2="360" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.5"/>
    <line x1="50" y1="380" x2="105" y2="380" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.5"/>
    <line x1="50" y1="400" x2="110" y2="400" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1.5"/>
    <text x="80" y="445" text-anchor="middle" fill="rgba(167, 139, 250, 0.8)" font-size="20">📚</text>
  </g>

  <!-- Book 2 - Top Left -->
  <g class="book-item" style="animation-delay: 0.1s;">
    <rect x="80" y="80" width="90" height="110" rx="6" 
          fill="rgba(167, 139, 250, 0.15)" 
          stroke="rgba(167, 139, 250, 0.4)" 
          stroke-width="2"
          transform="rotate(-15 125 135)"/>
    <line x1="95" y1="105" x2="160" y2="105" stroke="rgba(167, 139, 250, 0.5)" stroke-width="2" transform="rotate(-15 125 135)"/>
    <line x1="95" y1="125" x2="160" y2="125" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1.5" transform="rotate(-15 125 135)"/>
    <text x="125" y="65" text-anchor="middle" fill="rgba(167, 139, 250, 0.8)" font-size="22">📖</text>
  </g>

  <!-- Graduation Cap - Top Center -->
  <g class="grad-cap">
    <rect x="215" y="40" width="70" height="8" rx="1" fill="rgba(167, 139, 250, 0.8)"/>
    <polygon points="250,48 220,65 280,65" fill="rgba(167, 139, 250, 0.7)"/>
    <circle cx="250" cy="55" r="4" fill="rgba(167, 139, 250, 0.9)"/>
    <line x1="250" y1="59" x2="250" y2="80" stroke="rgba(167, 139, 250, 0.6)" stroke-width="2"/>
    <circle cx="240" cy="82" r="3" fill="rgba(167, 139, 250, 0.5)"/>
    <circle cx="260" cy="82" r="3" fill="rgba(167, 139, 250, 0.5)"/>
    <text x="250" y="100" text-anchor="middle" fill="rgba(167, 139, 250, 0.8)" font-size="24">🎓</text>
  </g>

  <!-- Progress Chart - Right Side -->
  <g class="progress-chart">
    <rect x="360" y="280" width="120" height="140" rx="8" 
          fill="rgba(167, 139, 250, 0.1)" 
          stroke="rgba(167, 139, 250, 0.4)" 
          stroke-width="2"/>
    <polyline points="375,390 390,360 405,375 420,340 435,355 450,320 465,340" 
              fill="none" 
              stroke="url(#bookGrad)" 
              stroke-width="3" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
    <line x1="370" y1="395" x2="470" y2="395" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1.5"/>
    <text x="420" y="410" text-anchor="middle" fill="rgba(167, 139, 250, 0.7)" font-size="12" font-weight="bold">Progress</text>
    <text x="420" y="430" text-anchor="middle" fill="rgba(167, 139, 250, 0.8)" font-size="22">📈</text>
  </g>

  <!-- Central Brain/Mind - Knowledge Hub -->
  <g class="knowledge-hub">
    <circle cx="250" cy="260" r="50" 
            fill="rgba(167, 139, 250, 0.15)" 
            stroke="url(#bookGrad)" 
            stroke-width="2.5"/>
    <circle cx="250" cy="260" r="35" 
            fill="none" 
            stroke="rgba(167, 139, 250, 0.3)" 
            stroke-width="1.5" 
            stroke-dasharray="5,3"/>
    <!-- Brain waves -->
    <path d="M 220 260 Q 230 250, 240 260 T 260 260 T 280 260" 
          fill="none" 
          stroke="rgba(167, 139, 250, 0.5)" 
          stroke-width="2" 
          stroke-linecap="round"/>
    <path d="M 220 275 Q 230 285, 240 275 T 260 275 T 280 275" 
          fill="none" 
          stroke="rgba(167, 139, 250, 0.4)" 
          stroke-width="1.5" 
          stroke-linecap="round"/>
    <text x="250" y="265" text-anchor="middle" fill="rgba(167, 139, 250, 0.9)" font-size="28">🧠</text>
  </g>

  <!-- Certificate - Bottom Right -->
  <g class="certificate">
    <rect x="350" y="340" width="110" height="80" rx="4" 
          fill="rgba(167, 139, 250, 0.12)" 
          stroke="rgba(167, 139, 250, 0.4)" 
          stroke-width="2"/>
    <line x1="365" y1="360" x2="435" y2="360" stroke="rgba(167, 139, 250, 0.5)" stroke-width="2"/>
    <line x1="365" y1="375" x2="435" y2="375" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1.5"/>
    <line x1="365" y1="390" x2="420" y2="390" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1.5"/>
    <circle cx="410" cy="355" r="6" fill="rgba(167, 139, 250, 0.6)"/>
    <text x="405" y="415" text-anchor="middle" fill="rgba(167, 139, 250, 0.8)" font-size="20">✓</text>
  </g>

  <!-- Language/Arabic - Left Side -->
  <g class="language-element">
    <circle cx="180" cy="200" r="45" 
            fill="rgba(167, 139, 250, 0.12)" 
            stroke="rgba(167, 139, 250, 0.4)" 
            stroke-width="2"/>
    <text x="180" y="215" text-anchor="middle" fill="rgba(167, 139, 250, 0.9)" font-size="32">ع</text>
    <text x="180" y="240" text-anchor="middle" fill="rgba(167, 139, 250, 0.7)" font-size="14" font-weight="bold">Arabic</text>
  </g>

  <!-- Sparkle effects -->
  <circle cx="150" cy="120" r="3" fill="rgba(167, 139, 250, 0.6)"/>
  <circle cx="320" cy="100" r="2.5" fill="rgba(167, 139, 250, 0.4)"/>
  <circle cx="380" cy="220" r="2" fill="rgba(167, 139, 250, 0.5)"/>
  <circle cx="100" cy="400" r="2.5" fill="rgba(167, 139, 250, 0.4)"/>
  <circle cx="450" cy="450" r="3" fill="rgba(167, 139, 250, 0.5)"/>

  <!-- Decorative connecting dots on path -->
  <circle cx="80" cy="250" r="5" fill="rgba(167, 139, 250, 0.5)" stroke="rgba(167, 139, 250, 0.8)" stroke-width="2"/>
  <circle cx="250" cy="120" r="5" fill="rgba(167, 139, 250, 0.6)" stroke="rgba(167, 139, 250, 0.9)" stroke-width="2"/>
  <circle cx="420" cy="260" r="5" fill="rgba(167, 139, 250, 0.5)" stroke="rgba(167, 139, 250, 0.8)" stroke-width="2"/>
</svg>