services:
  # PostgreSQL Database with pgvector extension
  db:
    image: ankane/pgvector:latest
    container_name: nlp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nlp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-nlp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlp_admin} -d ${POSTGRES_DB:-nlp_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nlp_network
    restart: unless-stopped

  # Redis for Django Channels
  redis:
    image: redis:7-alpine
    container_name: nlp_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nlp_network
    restart: unless-stopped

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: nlp_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - nlp_network
    restart: unless-stopped

  # Elasticsearch for search functionality
  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    container_name: nlp_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nlp_network
    restart: unless-stopped

  # Django Application (Plateforme)
  django:
    build:
      context: ./Plateforme
      dockerfile: Dockerfile
    container_name: nlp_django
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-nlp_admin}:${POSTGRES_PASSWORD:-changeme123}@db:5432/${POSTGRES_DB:-nlp_platform}
      
      # Django
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      
      # Celery
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/4
      
      # Email
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      
      # Elasticsearch
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      
      # FastAPI Chatbot
      FASTAPI_URL: http://fastapi:8000
      FASTAPI_API_KEY: ${FASTAPI_API_KEY:-}
      
      # Chatbot Settings
      CHATBOT_MAX_HISTORY: ${CHATBOT_MAX_HISTORY:-20}
      CHATBOT_MAX_TOKENS: ${CHATBOT_MAX_TOKENS:-8192}
      CHATBOT_TIMEOUT: ${CHATBOT_TIMEOUT:-180}
      CHATBOT_MAX_FILE_SIZE: ${CHATBOT_MAX_FILE_SIZE:-20971520}
      
      # Groq (scraping LLM validation)
      GROQ_SCRAPING_API_KEY: ${GROQ_SCRAPING_API_KEY}
      GROQ_SCRAPING_MODEL: ${GROQ_SCRAPING_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - ./Plateforme:/app
      - static_volume:/app/staticfiles
      - ./Plateforme/media:/app/media
    ports:
      - "8888:8000"
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate --noinput &&
        daphne -b 0.0.0.0 -p 8000 Plateforme.asgi:application
      "
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - nlp_network
    restart: unless-stopped

  # FastAPI Chatbot
  fastapi:
    build:
      context: ./fastapi_chatbot
      dockerfile: Dockerfile
    container_name: nlp_fastapi
    cpus: 1.0
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nlp_admin}:${POSTGRES_PASSWORD:-changeme123}@db:5432/${POSTGRES_DB:-nlp_platform}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-mpnet-base-v2}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_GRPC_PORT: "6334"
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.35}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-2048}
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      # Disable parallelism — protect CPU
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      TORCH_NUM_THREADS: "1"
      NUMEXPR_MAX_THREADS: "1"
    volumes:
      - ./fastapi_chatbot:/app
      - fastapi_cache:/app/.cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nlp_network
    restart: unless-stopped

  # Celery Worker for background document processing
  celery_worker:
    build:
      context: ./fastapi_chatbot
      dockerfile: Dockerfile
    container_name: nlp_celery_worker
    cpus: 1.0
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nlp_admin}:${POSTGRES_PASSWORD:-changeme123}@db:5432/${POSTGRES_DB:-nlp_platform}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-mpnet-base-v2}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_GRPC_PORT: "6334"
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.35}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-2048}
      # Disable parallelism — protect CPU
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      TORCH_NUM_THREADS: "1"
      NUMEXPR_MAX_THREADS: "1"
    volumes:
      - ./fastapi_chatbot:/app
      - fastapi_cache:/app/.cache
    command: celery -A app.celery_app:celery worker -Q chatbot,documents,ingestion -l info --concurrency=1
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery inspect ping --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - nlp_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: nlp_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/static:ro
      - ./Plateforme/media:/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
      - fastapi
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nlp_network
    restart: unless-stopped

  # ── Django Celery Worker (scraping background tasks) ──────────────
  django_celery_worker:
    build:
      context: ./Plateforme
      dockerfile: Dockerfile
    container_name: nlp_django_celery_worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nlp_admin}:${POSTGRES_PASSWORD:-changeme123}@db:5432/${POSTGRES_DB:-nlp_platform}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/4
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      FASTAPI_URL: http://fastapi:8000
      FASTAPI_API_KEY: ${FASTAPI_API_KEY:-}
      GROQ_SCRAPING_API_KEY: ${GROQ_SCRAPING_API_KEY:-}
      GROQ_SCRAPING_MODEL: ${GROQ_SCRAPING_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - ./Plateforme:/app
      - static_volume:/app/staticfiles
      - ./Plateforme/media:/app/media
    command: celery -A Plateforme worker -Q scraping -l info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - nlp_network
    restart: unless-stopped

  # ── Django Celery Beat (periodic task scheduler) ──────────────────
  django_celery_beat:
    build:
      context: ./Plateforme
      dockerfile: Dockerfile
    container_name: nlp_django_celery_beat
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nlp_admin}:${POSTGRES_PASSWORD:-changeme123}@db:5432/${POSTGRES_DB:-nlp_platform}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/4
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    volumes:
      - ./Plateforme:/app
    command: celery -A Plateforme beat -l info --scheduler celery.beat:PersistentScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nlp_network
    restart: unless-stopped

networks:
  nlp_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  elasticsearch_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  fastapi_cache:
    driver: local